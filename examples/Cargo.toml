[package]
edition = "2021"
name = "nrf-modem-examples"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[dependencies]
# embassy-executor = { version = "0.6", features = ["defmt", "task-arena-size-32768", "arch-cortex-m", "executor-thread", "executor-interrupt", "integrated-timers"] }
# embassy-executor = { version = "0.6", features = ["defmt", "task-arena-size-65536", "arch-cortex-m", "executor-thread", "executor-interrupt", "integrated-timers"] }
embassy-executor = { version = "0.6", features = ["defmt", "task-arena-size-81920", "arch-cortex-m", "executor-thread", "executor-interrupt", "integrated-timers"] }
embassy-time = { version = "0.3", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.2", features = ["defmt", "time-driver-rtc1", "gpiote", "time"] }

nrf9120-pac = "0.12.2"

defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3.1", features = ["print-defmt"]}

cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"

nrf-modem = { path = "../", default-features = false, features = []}
tinyrlibc = "0.4.0"

arrayvec = { version = "0.7", default-features = false }
embedded-io-async = "0.6.1"

at-commands = "0.5.4"

futures = { version = "0.3", default-features = false, features = ["async-await"] }

rust-mqtt = { version = "0.3.0", default-features = false, features = ["no_std"] }
# tinymqtt = "0.1.3"
# # reqwless = "=0.12.1"
# embedded-tls = { version = "0.17.1", default-features = false, features = ["defmt", "alloc"] }
# rand = { version = "0.8.5", features = ["small_rng", "std_rng"], default-features = false }
# rand_core = "0.6"
# signature = { version = "2.2", default-features = false }
# alloc-cortex-m = "0.4.2"
# embedded-alloc = "0.5.1"
# rsa = { version = "0.9.6", default-features = false, featuers = ["sha2"]}
# sha2 = { version = "0.10.8", default-features = false, features = ["oid"] }
# der = { version = "0.7.9", feature = ["derive"] }
# spki = "0.7.3"
# p256 = { version = "0.13.2", default-features = false, features = [
#     "ecdh",
#     "ecdsa",
#     "sha256",
# ] }
# heapless = { version = "0.8", default-features = false }

# picky-asn1-x509 = "0.13.0"

# serde = { version = "1", default-features = false }
# serde-json-core = "0.6.0"

[profile.release]
debug = 2

[features]
default = ["nrf9151"]
nrf9160 = ["nrf-modem/nrf9160", "embassy-nrf/nrf9160-ns" ]
nrf9151 = ["nrf-modem/nrf9151", "embassy-nrf/nrf9151-ns" ]
debug = ["nrf-modem/defmt"]
install_creds = []
ec = []
rsa = []

[patch.crates-io]
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", rev = "ff3f354893a77f4aba0025c047568dd6855f3a4f" }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", rev = "ff3f354893a77f4aba0025c047568dd6855f3a4f" }
embassy-nrf = { git = "https://github.com/embassy-rs/embassy.git", rev = "ff3f354893a77f4aba0025c047568dd6855f3a4f" }

# rust-mqtt = { path = "../../rust-mqtt" }
# embedded-tls = { path = "../../embedded-tls" }
